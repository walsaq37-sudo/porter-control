<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b33"><title>Updating stock</title><style>body{margin:0;font-family:system-ui;background:#061426;color:#fff;display:grid;place-items:center;min-height:100vh}.card{max-width:420px;margin:20px;padding:24px;border:1px solid #1d4b78;border-radius:18px;background:#0b2340;text-align:center}.ok{color:#7df0aa;font-weight:800}</style></head><body><div class="card"><h1>🥛 Underground Stock</h1><p id="status">Updating milk quantities…</p></div><script>const k='porter-v3-stock-underground';let s;try{s=JSON.parse(localStorage.getItem(k))}catch(e){}if(!s||!Array.isArray(s.items))s={items:[]};function setItem(name,qty){let x=s.items.find(i=>i.name===name);if(x)x.qty=qty;else s.items.push({name,qty})}setItem('Semi-skimmed milk',24);setItem('Oat milk',312);localStorage.setItem(k,JSON.stringify(s));document.getElementById('status').innerHTML='<span class="ok">✓ Stock updated</span><br><br>Semi-skimmed milk: <strong>24</strong><br>Oat milk: <strong>312</strong>';setTimeout(()=>location.replace('./'),1200);</script></body></html>
