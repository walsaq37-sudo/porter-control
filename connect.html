<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b33"><title>Porter Control · Connect</title><style>body{margin:0;background:#071b33;color:#fff;font-family:system-ui;padding:24px}.card{max-width:620px;margin:auto;background:#0b2340;border:1px solid #1d4b78;border-radius:18px;padding:20px}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;margin-top:12px;font-size:16px}input{background:#061426;color:#fff;border:1px solid #1d4b78}button{border:0;background:#22c55e;color:#fff;font-weight:800}.muted{color:#a9bdd3}</style><div class="card"><h1>🔗 Connect shared database</h1><p class="muted">Paste the Supabase Publishable key once on this device. It stays on this device.</p><input id="k" type="password" placeholder="sb_publishable_…"><button onclick="save()">Connect Porter Control</button><p id="m" class="muted"></p></div><script>function save(){const k=document.getElementById('k').value.trim();if(!k.startsWith('sb_publishable_')){document.getElementById('m').textContent='Please paste the Publishable key.';return}localStorage.setItem('porter-supabase-key',k);document.getElementById('m').textContent='Connected. Opening Porter Control…';setTimeout(()=>location.href='./',700)}</script></html>
