<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b33"><title>Porter Control Shared Test</title><style>body{margin:0;background:#071b33;color:#fff;font-family:system-ui;padding:18px}.card{background:#0b2340;border:1px solid #1d4b78;border-radius:16px;padding:16px;margin:12px auto;max-width:650px}input,button,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin-top:10px;font-size:16px}button{background:#22c55e;color:white;border:0;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #1d4b78;padding:12px 0}.qty{font-weight:900;color:#62b6ff}.muted{color:#a9bdd3}</style><div class="card"><h1>🧹 Porter Control</h1><h2>Shared inventory test</h2><div id="setup"><p class="muted">Paste the Supabase Publishable key once on this device.</p><input id="key" type="password" placeholder="sb_publishable_…"><button onclick="saveKey()">Connect</button></div><div id="ready" style="display:none"><select id="store" onchange="loadStock()"><option value="17">Store 17</option><option value="47">Store 47</option><option value="underground">Underground</option><option value="98">Store 98</option></select><button onclick="loadStock()">Refresh shared stock</button><div id="status" class="muted"></div><div id="items"></div></div></div><script>const URL='https://rtgiaaztmgwqtqpgswvb.supabase.co/rest/v1';function saveKey(){const k=document.getElementById('key').value.trim();if(!k.startsWith('sb_publishable_'))return alert('Paste the Publishable key');localStorage.setItem('porter-supabase-key',k);start()}function start(){if(!localStorage.getItem('porter-supabase-key'))return;document.getElementById('setup').style.display='none';document.getElementById('ready').style.display='block';loadStock()}async function loadStock(){const k=localStorage.getItem('porter-supabase-key'),id=document.getElementById('store').value,s=document.getElementById('status');s.textContent='Loading shared database…';try{const r=await fetch(URL+'/inventory?store_id=eq.'+encodeURIComponent(id)+'&select=product_name,quantity&order=product_name.asc',{headers:{apikey:k}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();document.getElementById('items').innerHTML=rows.length?rows.map(x=>'<div class="row"><strong>'+x.product_name+'</strong><span class="qty">'+x.quantity+'</span></div>').join(''):'<p>No products yet.</p>';s.textContent='✓ Shared database connected'}catch(e){s.textContent='Connection error';console.error(e)}}start()</script></html>
