<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b33"><title>Updating stock</title><style>body{margin:0;font-family:system-ui;background:#061426;color:#fff;display:grid;place-items:center;min-height:100vh}.card{max-width:460px;margin:20px;padding:24px;border:1px solid #1d4b78;border-radius:18px;background:#0b2340;text-align:center}.ok{color:#7df0aa;font-weight:800}</style></head><body><div class="card"><h1>📦 Porter Control Stock</h1><p id="status">Updating confirmed quantities…</p></div><script>function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function setItems(key,values){let s=load(key);if(!s||!Array.isArray(s.items))s={items:[]};Object.entries(values).forEach(([name,qty])=>{let x=s.items.find(i=>i.name===name);if(x)x.qty=qty;else s.items.push({name,qty})});localStorage.setItem(key,JSON.stringify(s))}setItems('porter-v3-stock-underground',{'Semi-skimmed milk':24,'Oat milk':312});setItems('porter-v3-stock-17',{'Magic sponge':70,'Green scourer':30,'Green sponge with foam':40,'Dishwasher salt':5,'Dishwasher tablets':8,'Dishwasher cleaner':19,'Viakal':5,'Glass & Stainless Steel Cleaner':1,'Foaming Washroom Descaler':3,'Spot Light Carpet Care':3});document.getElementById('status').innerHTML='<span class="ok">✓ Stock updated</span><br><br>Store 17 quantities loaded.<br>Milk quantities preserved.';setTimeout(()=>location.replace('./'),1400);</script></body></html>
