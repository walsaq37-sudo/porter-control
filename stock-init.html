<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b33"><title>Updating stock</title><style>body{margin:0;font-family:system-ui;background:#061426;color:#fff;display:grid;place-items:center;min-height:100vh}.card{max-width:460px;margin:20px;padding:24px;border:1px solid #1d4b78;border-radius:18px;background:#0b2340;text-align:center}.ok{color:#7df0aa;font-weight:800}</style></head><body><div class="card"><h1>📦 Porter Control Stock</h1><p id="status">Updating Store 17…</p></div><script>function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function setItems(key,values){let s=load(key);if(!s||!Array.isArray(s.items))s={items:[]};Object.entries(values).forEach(([name,qty])=>{let x=s.items.find(i=>i.name===name);if(x)x.qty=qty;else s.items.push({name,qty})});localStorage.setItem(key,JSON.stringify(s))}setItems('porter-v3-stock-underground',{'Semi-skimmed milk':24,'Oat milk':312});localStorage.setItem('porter-v3-stock-17',JSON.stringify({items:[{name:'Magic sponge',qty:70},{name:'Green scourer',qty:30},{name:'Green sponge with foam',qty:40},{name:'Crystale dishwasher salt',qty:5},{name:'Finish Powerball dishwasher tablets',qty:8},{name:'Finish dishwasher deep cleaner',qty:19},{name:'Viakal',qty:5},{name:'Glass & Stainless Steel Cleaner',qty:1},{name:'Foaming Washroom Descaler',qty:3},{name:'Spot Light Carpet Care',qty:3}]}));document.getElementById('status').innerHTML='<span class="ok">✓ Store 17 updated</span><br><br>10 products and confirmed quantities loaded.';setTimeout(()=>location.replace('./'),1800);</script></body></html>
